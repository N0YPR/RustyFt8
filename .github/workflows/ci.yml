name: CI

# Continuous Integration workflow
# Currently handles Docker image building and registry management
# TODO: Add additional build, test, and deployment steps

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  docker-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      ci_image: ${{ steps.image-names.outputs.ci_image }}
      devcontainer_image: ${{ steps.image-names.outputs.devcontainer_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate image names
        id: image-names
        run: |
          # Use docker-utils to get image naming components
          IMAGE_NAME=$(./scripts/docker-utils.sh repo-name)
          BRANCH_SUFFIX=$(./scripts/docker-utils.sh branch-suffix)

          # Use GitHub repository owner for username in CI (convert to lowercase for Docker)
          GITHUB_USER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # Calculate image names for both targets
          CI_IMAGE="ghcr.io/${GITHUB_USER}/${IMAGE_NAME}:latest-ci${BRANCH_SUFFIX}"
          DEVCONTAINER_IMAGE="ghcr.io/${GITHUB_USER}/${IMAGE_NAME}:latest-devcontainer${BRANCH_SUFFIX}"

          echo "ci_image=${CI_IMAGE}" >> $GITHUB_OUTPUT
          echo "devcontainer_image=${DEVCONTAINER_IMAGE}" >> $GITHUB_OUTPUT
          echo "registry=ghcr.io/${GITHUB_USER}" >> $GITHUB_OUTPUT

          echo "CI image: ${CI_IMAGE}"
          echo "Devcontainer image: ${DEVCONTAINER_IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CI & Devcontainer images
        env:
          REGISTRY: ${{ steps.image-names.outputs.registry }}
        run: |
          echo "========================================="
          echo "Processing CI Image"
          echo "========================================="
          if ./scripts/docker-utils.sh image-exists ci; then
            echo "✓ CI image already exists in registry, skipping build"
          else
            echo "CI image not found, building and pushing..."
            ./scripts/docker-utils.sh build-and-push ci
          fi
          echo ""
          echo "========================================="
          echo "Processing Devcontainer Image"
          echo "========================================="
          if ./scripts/docker-utils.sh image-exists devcontainer; then
            echo "✓ Devcontainer image already exists in registry, skipping build"
          else
            echo "Devcontainer image not found, building and pushing..."
            echo "Note: This build will reuse layers from CI image if it was built"
            ./scripts/docker-utils.sh build-and-push devcontainer
          fi

 